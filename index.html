<!doctype html>
<html lang="fr" data-theme="light" data-brand="groupe">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilotage communication</title>
<meta name="theme-color" content="#1D2226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=7">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  (function(){try{var t=JSON.parse(localStorage.getItem('hy-theme'));if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t;
  var b=JSON.parse(localStorage.getItem('hc-univ'));if(['groupe','energies','transport','granules'].indexOf(b)>-1)document.documentElement.dataset.brand=b}catch(e){}})();
</script>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="scene on" data-scene="0">
    <span class="sh circle" style="background:var(--accent);width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;--dx:60px;--dy:40px"></span>
    <span class="sh square" style="background:var(--action);width:30vmax;height:30vmax;right:-6vmax;top:18vh;--dx:-50px;--dy:50px;--rot:30deg"></span>
    <span class="sh circle" style="background:var(--soft);width:36vmax;height:36vmax;left:30vw;bottom:-22vmax;--dx:40px;--dy:-60px"></span>
  </div>
  <div class="scene" data-scene="1">
    <span class="sh ringshape" style="--c:var(--accent);width:44vmax;height:44vmax;right:-14vmax;top:-12vmax;--dx:-40px;--dy:40px"></span>
    <span class="sh circle" style="background:var(--action);width:28vmax;height:28vmax;left:-6vmax;bottom:-6vmax;--dx:60px;--dy:-30px"></span>
    <span class="sh pillshape" style="background:var(--soft);width:42vmax;height:16vmax;left:24vw;top:32vh;--dx:-60px;--dy:20px;--rot:-14deg"></span>
  </div>
  <div class="scene" data-scene="2">
    <span class="sh square" style="background:var(--accent);width:34vmax;height:34vmax;left:-8vmax;top:10vh;--dx:50px;--dy:-40px;--rot:45deg"></span>
    <span class="sh square" style="background:var(--action);width:26vmax;height:26vmax;right:4vw;bottom:-8vmax;--dx:-40px;--dy:-50px;--rot:-30deg"></span>
    <span class="sh circle" style="background:var(--soft);width:30vmax;height:30vmax;right:-10vmax;top:-12vmax;--dx:-30px;--dy:50px"></span>
  </div>
  <div class="scene" data-scene="3">
    <span class="sh pillshape" style="background:var(--accent);width:56vmax;height:18vmax;left:-10vmax;top:-4vmax;--dx:70px;--dy:30px;--rot:12deg"></span>
    <span class="sh circle" style="background:var(--action);width:26vmax;height:26vmax;right:6vw;top:40vh;--dx:-40px;--dy:-40px"></span>
    <span class="sh ringshape" style="--c:var(--soft);width:34vmax;height:34vmax;left:10vw;bottom:-18vmax;--dx:40px;--dy:-30px"></span>
  </div>
  <div class="scene" data-scene="4">
    <span class="sh circle" style="background:var(--action);width:40vmax;height:40vmax;right:-12vmax;bottom:-14vmax;--dx:-50px;--dy:-40px"></span>
    <span class="sh square" style="background:var(--accent);width:24vmax;height:24vmax;left:6vw;top:-6vmax;--dx:40px;--dy:60px;--rot:24deg"></span>
    <span class="sh pillshape" style="background:var(--soft);width:40vmax;height:14vmax;left:-8vmax;bottom:12vh;--dx:60px;--dy:-20px;--rot:-20deg"></span>
  </div>
</div>

<!-- LOGIN -->
<section id="login" class="center-screen" hidden>
  <div class="login-card glass" id="loginCard">
    <span class="logo" data-logo></span>
    <h1 id="loginTitle">Pilotage de la communication</h1>
    <p class="lead" id="loginLead">Accès réservé à l'équipe communication et à la direction. Connectez-vous avec votre compte.</p>
    <form class="form" id="loginForm" novalidate>
      <label class="field"><span>Adresse e-mail</span><input class="input" id="email" type="email" autocomplete="username" placeholder="prenom.nom@hympyr.fr"></label>
      <label class="field"><span>Mot de passe</span><input class="input" id="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe"></label>
      <p class="msg" id="loginMsg" role="status" aria-live="polite"></p>
      <button class="btn block mag" type="submit" id="loginBtn" style="width:100%">Se connecter</button>
    </form>
    <form class="form" id="resetForm" novalidate hidden>
      <label class="field"><span>Nouveau mot de passe</span><input class="input" id="newPassword" type="password" autocomplete="new-password" placeholder="8 caractères minimum"></label>
      <p class="msg" id="resetMsg" role="status"></p>
      <button class="btn mag" type="submit" style="width:100%">Enregistrer le mot de passe</button>
    </form>
    <div style="margin-top:16px;display:flex;justify-content:center"><button class="btn text sm" id="forgotBtn" type="button">Mot de passe oublié ?</button></div>
  </div>
</section>

<!-- PUBLIC REQUEST FORM (#demande) -->
<section id="publicReq" class="center-screen" hidden></section>

<!-- APP -->
<div id="app" hidden>
  <header class="topbar glass">
    <a class="logo" href="#" data-logo data-home aria-label="Accueil"></a>
    <nav class="tabs glide" id="tabs" aria-label="Navigation principale"></nav>
    <div class="right">
      <button class="icon-btn mag" id="searchBtn" aria-label="Rechercher (Ctrl K)" title="Rechercher"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="icon-btn mag" id="bellBtn" aria-label="Notifications" title="Notifications"><svg class="i" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4"/></svg><i class="dotn" id="bellDot"></i></button>
      <button class="icon-btn mag theme-btn" id="themeBtn" aria-label="Passer en mode sombre">
        <svg class="i sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button class="icon-btn mag" id="logoutBtn" aria-label="Retour au portail" title="Retour au portail"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg></button>
    </div>
  </header>
  <main>
    <div class="univers-wrap"><div class="seg glass glide univers scroll" id="univers" role="tablist" aria-label="Univers"></div></div>
    <div id="view"></div>
  </main>
  <nav class="bottombar glass" id="bottombar" aria-label="Navigation mobile"></nav>
  <button class="ticket-fab glass mag" id="ticketBtn"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg><span class="fl">Envoyer un ticket</span><span class="fs">Ticket</span></button>
</div>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>
<div id="layer"></div>

<script type="module" src="js/app.js?v=7"></script>
</body>
</html>
